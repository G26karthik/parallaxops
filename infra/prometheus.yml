# Sample Prometheus scrape config for the local stack. Grafana is optional and not required.
# Run any Prometheus binary against it, e.g.: prometheus --config.file=infra/prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: parallaxops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4000"]
  - job_name: parallaxops-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9108"]
