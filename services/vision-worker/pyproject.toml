[project]
name = "parallaxops-vision"
version = "0.1.0"
description = "ParallaxOps vision worker: image QC, COLMAP-based SfM, geometric QA, and exports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.2",
  "opencv-python-headless>=4.10",
  "open3d>=0.19",
  "pycolmap==4.2.1",
  "pillow>=11",
  "psutil>=6",
  "pydantic>=2.9",
  "typer>=0.15",
  "rich>=13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
worker = ["temporalio>=1.34", "httpx>=0.28", "boto3>=1.35", "prometheus-client>=0.21"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13", "py7zr>=0.22"]

[project.scripts]
vision = "parallaxops_vision.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallaxops_vision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"] # the formatter owns line breaks; long advice strings are fine

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false # numpy/pycolmap/open3d return untyped values
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pycolmap", "pycolmap.*", "open3d", "open3d.*", "cv2", "matplotlib.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real dataset (see docs/DATASETS.md); skipped when absent",
  "gpu: needs a CUDA-capable COLMAP build",
]
addopts = "-ra"
