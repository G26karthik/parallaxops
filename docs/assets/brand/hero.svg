<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">ParallaxOps</title>
  <desc id="d">Distributed, quality-aware 3D reconstruction intelligence. Three layers of points and frames drift at different speeds to suggest parallax.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="-10%" r="75%">
      <stop offset="0" stop-color="#f2b441" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2b441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <pattern id="far" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="1.3" fill="#4cc2c4" opacity="0.35"/>
      <circle cx="31" cy="30" r="1.1" fill="#4cc2c4" opacity="0.25"/>
    </pattern>
    <pattern id="mid" width="74" height="74" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="20" r="2" fill="#4cc2c4" opacity="0.55"/>
      <circle cx="52" cy="48" r="1.7" fill="#e8ecf1" opacity="0.35"/>
    </pattern>
    <pattern id="near" width="118" height="118" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="40" r="3" fill="#f2b441" opacity="0.75"/>
      <circle cx="88" cy="82" r="2.4" fill="#e8ecf1" opacity="0.5"/>
    </pattern>
    <clipPath id="view"><rect width="1280" height="330" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#view)">
    <rect width="1280" height="330" fill="url(#bg)"/>
    <rect width="1280" height="330" fill="url(#glow)"/>

    <!-- three depth layers: nearer layers move faster, which is the parallax cue -->
    <g>
      <rect x="-160" width="1600" height="330" fill="url(#far)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-46 0" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="-160" width="1600" height="330" fill="url(#mid)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-74 0" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="-160" width="1600" height="330" fill="url(#near)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-118 0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- camera frusta, drifting at mid speed -->
    <g stroke="#f2b441" stroke-width="1.6" fill="none" opacity="0.8">
      <g>
        <path d="M900 190 l-44 -26 m44 26 l44 -26 m-44 26 l-44 26 m44 -26 l44 26 M856 164 h88 v52 h-88 z"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 6;0 0" dur="10s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.55">
        <path d="M1090 120 l-34 -20 m34 20 l34 -20 m-34 20 l-34 20 m34 -20 l34 20 M1056 100 h68 v40 h-68 z"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 -4;0 0" dur="13s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- wordmark -->
    <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
      <g transform="translate(70 86)">
        <rect x="0" y="22" width="44" height="44" rx="8" fill="#4cc2c4" opacity="0.35"/>
        <rect x="12" y="10" width="44" height="44" rx="8" fill="#4cc2c4" opacity="0.6"/>
        <rect x="24" y="-2" width="44" height="44" rx="8" fill="#f2b441"/>
        <circle cx="46" cy="20" r="6.5" fill="#0b0d10"/>
      </g>
      <text x="162" y="136" font-size="62" font-weight="700" fill="#e8ecf1" letter-spacing="-1.5">Parallax<tspan fill="#f2b441">Ops</tspan></text>
      <text x="164" y="184" font-size="23" fill="#a0aab8">Distributed, quality-aware 3D reconstruction intelligence.</text>
      <text x="164" y="232" font-size="16" fill="#7e8998" font-family="ui-monospace, Consolas, monospace" letter-spacing="0.4">real SfM  ·  geometric QA  ·  durable workflows  ·  honest numbers</text>
    </g>
  </g>
</svg>
